name: CI

# Only on PRs: pushes to main already build in deploy.yml.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Distinct from deploy.yml's `build` job so the required check is unambiguous.
  ci-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
