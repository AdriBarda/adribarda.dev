name: Setup pnpm and Node.js for CI/CD
description: Install pnpm and Node.js with the pnpm store cached, then install dependencies

inputs:
  node-version:
    description: 'Node.js version to install'
    required: false
    default: '26'

runs:
  using: 'composite'
  steps:
    # No `version`: it's read from `packageManager` in package.json, so CI,
    # Vercel and local all use the same pnpm. Setting both fails if they differ.
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
